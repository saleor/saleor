name: Tests & Linters

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches:
      - main
      - ci/*
    paths:
      - "**.py"
      - Dockerfile
      - "saleor/**"
      - .github/workflows/tests-and-linters.yml
      - pyproject.toml
      - uv.lock

env:
  BENCH_PATH: ./queries-results.json
  CACHE_URL: "redis://cache:6379/0"
  DATABASE_URL: "postgres://saleor:saleor@postgres:5432/saleor"
  SECRET_KEY: ci-test

# Will group same workflow in the PR. Once new commit is pushed, old workflow will be cancelled
# This is saving resources and prevents unnecessary queues when fresh jobs wait for stale ones
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    container: python:3.12
    name: Run unit tests

    services:
      postgres:
        image: library/postgres:15-alpine
        env:
          POSTGRES_PASSWORD: saleor
          POSTGRES_USER: saleor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: valkey/valkey:8.1-alpine
        options: >-
          --health-cmd "valkey-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Check for changes requiring tests
        id: changes
        env:
          BASE_COMMIT_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # This check replaces an `on.pull_request.paths` filter. A workflow skipped
          # by path filtering never reports a check run, so it can never be made a
          # required status check without deadlocking every PR it does not match.
          # A job that runs and exits early does report, so it can be required.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Files that require this workflow to run, as extended regular expressions.
          # Mirrors what used to be the `on.pull_request.paths` filter.
          RELEVANT_PATHS=(
            '\.py$'
            '^Dockerfile$'
            '^saleor/'
            '^pyproject\.toml$'
            '^uv\.lock$'
            '^\.github/workflows/tests-and-linters\.yml$'
          )

          # `git config` is a workaround for https://github.com/actions/runner-images/issues/6775
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # The checkout is shallow, so the base commit has to be fetched before diffing.
          git fetch --depth=1 origin "$BASE_COMMIT_SHA"

          if git diff --name-only "$BASE_COMMIT_SHA" HEAD \
            | grep -qEf <(printf '%s\n' "${RELEVANT_PATHS[@]}"); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            MSG="No Python, Dockerfile or dependency changes - skipping tests."
            echo "$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          apt-get install -y libpq-dev
        if: steps.changes.outputs.run == 'true'

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.0.0
        with:
          enable-cache: true
        if: steps.changes.outputs.run == 'true'

      - name: Install dependencies
        run: |
          uv sync --locked
        if: steps.changes.outputs.run == 'true'

      - name: Run unit tests
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run pytest \
            -m "not e2e" \
            --cov \
            --cov-report= \
            --junitxml=junit/test-results.xml \
            -o junit_family=legacy \
            --django-db-bench=${{ env.BENCH_PATH }} \
            -n logical
        if: steps.changes.outputs.run == 'true'

      - name: Upload test results to Codecov
        # Run even if tests fail
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Publish coverage and test results
      - uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: steps.changes.outputs.run == 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: junit/test-results.xml
        if: ${{ always() && steps.changes.outputs.run == 'true' }}

      # Publish detected differences as comment
      - uses: NyanKiyoshi/pytest-django-queries-ci-tools@v1
        with:
          query_raw_dump_path: ${{ env.BENCH_PATH }}
          diff_endpoint: "https://dtab784j47g1o.cloudfront.net/default/saleor-db-queries-bot-diff"
          diff_results_base_url: "https://dtab784j47g1o.cloudfront.net"
        if: github.event_name == 'pull_request' && github.repository == 'saleor/saleor' && steps.changes.outputs.run == 'true'

      # Save results for future comparison against pull requests
      - uses: NyanKiyoshi/pytest-django-queries-ci-tools@v1
        with:
          query_raw_dump_path: ${{ env.BENCH_PATH }}
          upload_endpoint: ${{ secrets.QUERIES_UPLOAD_ENDPOINT_URL }}
          upload_secret_key: ${{ secrets.QUERIES_UPLOAD_SECRET }}
        if: github.event_name == 'push' && github.repository == 'saleor/saleor'

  linters:
    runs-on: ubuntu-latest
    container: python:3.12
    name: Run linters

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get install -y libpq-dev

      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      # Run linters and Django related checks
      # `git config` command is a workaround for https://github.com/actions/runner-images/issues/6775
      - name: Run Linters and Checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run pre-commit run --all --show-diff-on-failure
        if: ${{ always() }}
