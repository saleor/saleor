name: e2e suite

on:
  workflow_dispatch:
  schedule:
    # At 2:00 AM UTC on Monday, Wednesday, and Friday
    - cron: "00 2 * * 1,3,5"
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}
env:
  DATABASE_URL: "postgres://saleor:saleor@postgres:5432/saleor"
  SECRET_KEY: ci-test

jobs:
  # Runs on a bare runner, so a PR without relevant changes skips the test job
  # before its service containers are started. A job skipped by `if` reports as
  # "Skipped", which satisfies a required status check.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for changes requiring E2E tests
        id: changes
        uses: ./.github/actions/detect-python-changes
        with:
          # Re-run whenever this workflow itself changes.
          additional-file-patterns: '^\.github/workflows/e2e\.yml$'

  e2e-tests:
    needs: [changes]
    # Compared against 'false' so that a failed change check runs the tests.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.changed != 'false'
      && (github.event_name != 'schedule' || github.repository == 'saleor/saleor') }}
    runs-on: ubuntu-22.04
    container: python:3.12
    name: Run E2E tests

    permissions:
      contents: read

    services:
      postgres:
        image: library/postgres:15-alpine
        env:
          POSTGRES_PASSWORD: saleor
          POSTGRES_USER: saleor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          apt-get install -y libpq-dev

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run E2E tests
        run: |
          uv run pytest -m "e2e" --junit-xml=e2e-test-results.xml

      - name: Surface failing tests
        if: ${{ !cancelled() }}
        uses: pmeier/pytest-results-action@fdc7f18d9934e38aca411ca9557e6577bd25ca9c # v0.9.0
        with:
          path: e2e-test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
          title: E2E core test results
