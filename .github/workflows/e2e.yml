name: e2e suite

on:
  workflow_dispatch:
  schedule:
    # At 2:00 AM UTC on Monday, Wednesday, and Friday
    - cron: "00 2 * * 1,3,5"
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DATABASE_URL: "postgres://saleor:saleor@postgres:5432/saleor"
  SECRET_KEY: ci-test

jobs:
  e2e-tests:
    runs-on: ubuntu-22.04
    container: python:3.12
    name: Run E2E tests

    services:
      postgres:
        image: library/postgres:15-alpine
        env:
          POSTGRES_PASSWORD: saleor
          POSTGRES_USER: saleor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check for changes requiring E2E tests
        id: changes
        env:
          BASE_COMMIT_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # This check replaces an `on.pull_request.paths` filter. A workflow skipped
          # by path filtering never reports a check run, so it can never be made a
          # required status check without deadlocking every PR it does not match.
          # A job that runs and exits early does report, so it can be required.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Files that require this workflow to run, as extended regular expressions.
          # Mirrors what used to be the `on.pull_request.paths` filter.
          RELEVANT_PATHS=(
            '\.py$'
            '^Dockerfile$'
            '^saleor/'
            '^pyproject\.toml$'
            '^poetry\.lock$'
            '^\.github/workflows/e2e\.yml$'
          )

          # `git config` is a workaround for https://github.com/actions/runner-images/issues/6775
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # The checkout is shallow, so the base commit has to be fetched before diffing.
          git fetch --depth=1 origin "$BASE_COMMIT_SHA"

          if git diff --name-only "$BASE_COMMIT_SHA" HEAD \
            | grep -qEf <(printf '%s\n' "${RELEVANT_PATHS[@]}"); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            MSG="No Python, Dockerfile or dependency changes - skipping E2E tests."
            echo "$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          apt-get install -y libpq-dev
        if: steps.changes.outputs.run == 'true'

      - name: Install and configure poetry
        run: |
          pip install poetry==2.1.1
        if: steps.changes.outputs.run == 'true'

      - name: Cache the venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-venv-${{ hashFiles('**/poetry.lock') }}
        if: steps.changes.outputs.run == 'true'

      - name: Install dependencies
        run: |
          poetry env use python3.12
          poetry sync
        if: ${{ steps.changes.outputs.run == 'true' && steps.cached-poetry-dependencies.outputs.cache-hit != 'true' }}

      - name: Add Python Virtual Environment to PATH
        run: |
          # Note: requires `poetry env use` to be ran, otherwise poetry
          # may not be able to find which virtual environment is in use.
          # Ticket: https://github.com/python-poetry/poetry/issues/7190
          echo "$(poetry env info -p)"/bin >> $GITHUB_PATH
        if: steps.changes.outputs.run == 'true'

      - name: Run E2E tests
        run: |
          pytest -m "e2e" --junit-xml=e2e-test-results.xml
        if: steps.changes.outputs.run == 'true'

      - name: Surface failing tests
        if: ${{ always() && steps.changes.outputs.run == 'true' }}
        uses: pmeier/pytest-results-action@4c22f3314dfc484aaad53353d3dd8dddf5de6b46 # v0.5.0
        with:
          path: e2e-test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
          title: E2E core test results
