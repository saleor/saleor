name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    paths:
      - "**.py"
      - Dockerfile
      - "saleor/**"
      - .github/workflows/tests.yaml
      - pyproject.toml
      - uv.lock

env:
  BENCH_PATH: ./queries-results.json
  CACHE_URL: "redis://cache:6379/0"
  DB_URL_XDIST_WORKER_0: "postgres://saleor:saleor@postgres:5432/test_saleor_gw0"
  DATABASE_URL: "postgres://saleor:saleor@postgres:5432/saleor"
  SECRET_KEY: ci-test

# Will group same workflow in the PR. Once new commit is pushed, old workflow will be cancelled
# This is saving resources and prevents unnecessary queues when fresh jobs wait for stale ones
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    container: python:3.12
    name: Run unit tests

    permissions:
      contents: read

    services:
      postgres:
        image: library/postgres:15-alpine
        env:
          POSTGRES_PASSWORD: saleor
          POSTGRES_USER: saleor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: valkey/valkey:8.1-alpine
        options: >-
          --health-cmd "valkey-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for changes requiring tests
        id: changes
        uses: ./.github/actions/detect-python-changes
        with:
          # Re-run whenever this workflow itself changes.
          additional-file-patterns: '^\.github/workflows/tests\.yaml$'

      - name: Install system dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          apt-get update
          apt-get install -y libpq-dev postgresql-client

      - if: steps.changes.outputs.changed == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          uv sync --locked

      - id: get-base
        name: Extract base branch name
        run: |
          # Falls back to `GITHUB_REF_NAME` when base is undefined which
          # means we merged into `main` or 3.x
          base=${GITHUB_BASE_REF:-$GITHUB_REF_NAME}
          base=${base#refs/heads/}

          is_release=
          if [[ "$base" =~ ^[0-9]\.[0-9]+$ ]]; then
            is_release=1
          elif [[ "$base" == "main" ]]; then
            is_release=1
          elif [[ "$base" == "feat/build/cache-db" ]]; then
            is_release=1
          else
            echo "Will skip caching: $base is not a main/release branch" >&2
          fi

          {
            echo "base=$base"
            echo "is-release=$is_release"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.changes.outputs.changed == 'true' }}
        with:
          path: ~/.cache/saleor-pgql/
          key: pytest-pgsql-db-${{ steps.get-base.outputs.base }}

      - name: Restore DB
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -u
          dump=$HOME/.cache/saleor-pgql/dump.sql

          if ! [[ -f "$dump" ]]; then
            echo "Skipping re-creating DB from cache: no cache found." >&2
            exit 0
          fi

          # Recreate gw0 (will serve as the template)
          echo "Creating gw0 from $dump..." >&2
          psql "$DATABASE_URL" <<< 'CREATE DATABASE test_saleor_gw0;'
          psql -f ~/.cache/saleor-pgql/dump.sql "$DB_URL_XDIST_WORKER_0"

          # Populate remaining xdist workers using gw0 as the template
          cpu_count=$(uv run python -c 'import psutil; print(psutil.cpu_count(logical=True))')
          for i in $(seq 1 "$(( cpu_count - 1 ))"); do
            db_name="test_saleor_gw$i"
            echo "Creating DB: $db_name..." >&2
            psql -v db_name="$db_name" "$DATABASE_URL" <<'EOSQL'
              CREATE DATABASE :"db_name" TEMPLATE test_saleor_gw0;
          EOSQL
          done

      - name: Run unit tests
        if: steps.changes.outputs.changed == 'true'
        run: |
          uv run pytest \
            --reuse-db \
            -m "not e2e" \
            --junitxml=junit/test-results.xml \
            -o junit_family=legacy \
            --django-db-bench="$BENCH_PATH" \
            -n logical

      - name: Cache DB
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p ~/.cache/saleor-pgql/
          pg_dump --format=p -f ~/.cache/saleor-pgql/dump.sql "$DB_URL_XDIST_WORKER_0"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          ${{ steps.get-base.outputs.is-release == '1'
              && steps.changes.outputs.changed == 'true' }}
        with:
          path: ~/.cache/saleor-pgql/
          key: pytest-pgsql-db-${{ steps.get-base.outputs.base }}

      - name: Upload Test Results
        if: ${{ !cancelled() && steps.changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: junit/test-results.xml
          # Throw an error if test results aren't reported. This could happen
          # when bumping dependencies for example.
          if-no-files-found: error

      # Publish detected differences as comment
      - name: Compare DB Queries Results (PR)
        if: github.event_name == 'pull_request' && github.repository == 'saleor/saleor' && steps.changes.outputs.changed == 'true'
        uses: NyanKiyoshi/pytest-django-queries-ci-tools@45b5ac36ff19669a88fe56429b662b0661d8f46b # v1.1.1
        with:
          query_raw_dump_path: ${{ env.BENCH_PATH }}
          diff_endpoint: "https://dtab784j47g1o.cloudfront.net/default/saleor-db-queries-bot-diff"
          diff_results_base_url: "https://dtab784j47g1o.cloudfront.net"

      - name: Upload DB Queries Results
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-django-db-queries-results
          path: ${{ env.BENCH_PATH }}
          if-no-files-found: error

  # Uploads the SQL count report for base branches
  upload-query-count-base-branch:
    if: github.event_name == 'push' && github.repository == 'saleor/saleor'

    needs: [unit_tests]
    runs-on: ubuntu-latest
    environment: pytest-upload-django-db-queries

    permissions: {}

    steps:
      - name: Download Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pytest-django-db-queries-results
          path: results/

      - name: Upload Results
        uses: NyanKiyoshi/pytest-django-queries-ci-tools@45b5ac36ff19669a88fe56429b662b0661d8f46b # v1.1.1
        with:
          query_raw_dump_path: results/queries-results.json
          upload_endpoint: ${{ secrets.QUERIES_UPLOAD_ENDPOINT_URL }}
          upload_secret_key: ${{ secrets.QUERIES_UPLOAD_SECRET }}
