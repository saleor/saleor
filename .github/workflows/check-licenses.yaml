name: Check Licenses
on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      # Self
      - ".github/workflows/check-licenses.yaml"
      # Python Ecosystem
      - "**/pyproject.toml"
      - "**/setup.py"
      - "**/requirements*.txt"
      - "**/Pipfile.lock"
      - "**/uv.lock"
      # JS/TS Ecosystem
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/package-lock.json"

permissions: {}

jobs:
  default:
    permissions:
      contents: read
      pull-requests: write
    uses: saleor/saleor-internal-actions/.github/workflows/run-license-check.yaml@d8bc107b3eb1c48111e47e1e2fc192232086f534 # v1.13.0
    with:
      # List of ecosystems to scan.
      ecosystems: >-
        python
        javascript
      # Grant rules (https://github.com/anchore/grant/blob/4362dc22cf5ea9baeccfa59b2863879afe0c30d7/README.md#usage)
      rules: |
        # Explicitly allow LGPL as "*GPL*" rule will cause to reject them otherwise.
        - pattern: "*lgpl*"
          name: "allow-lgpl"
          mode: "allow"
          reason: "LGPL is allowed."
        - pattern: "*gpl*"
          name: "deny-gpl"
          mode: "deny"
          reason: "GPL licenses are not compatible with BSD-3-Clause"
        - pattern: "*proprietary*"
          name: "deny-proprietary"
          mode: "deny"
          reason: >-
            Proprietary licenses are not compatible with BSD-3-Clause.
            They need to be reviewed on a case-by-case basis.
